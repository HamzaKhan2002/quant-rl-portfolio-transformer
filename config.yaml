tickers:
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - TSLA

data:
  sentiment_path: "deps/quant-nlp-claude-grok-sentiment/output/sentiment_features.csv"
  regime_path:    "deps/quant-multi-transformer-regimes/output/regime_probs.csv"

# ────────────────────────────────────────────────────────────────────────────
# Default date splits (Walk-Forward Fold 5 — current production split).
# Used by train.py / tune.py / evaluate.py when no --fold is specified.
# ────────────────────────────────────────────────────────────────────────────
splits:
  train_start: "2014-01-03"
  train_end:   "2023-12-31"
  val_start:   "2024-01-01"
  val_end:     "2024-12-31"
  test_start:  "2025-01-01"
  test_end:    "2025-12-31"

# ────────────────────────────────────────────────────────────────────────────
# Walk-Forward Fold Definitions  (used by src/walk_forward.py)
#
# DATA AVAILABILITY (fully extended as of this revision):
#   Sentiment data  : 2014-01-02 → 2025-12-31  [Phase 2, extended from 2014]
#     - EDGAR 10-K filings: 2014–2025 (EDGAR provides back to 1993)
#     - X/Grok social data: 2022–2025 only (has_x_data=0 flag for pre-2022)
#   Regime data     : ~2014-03-xx → 2026-02-27  [Phase 1, extended to 2014]
#   Price data      : fetched from yfinance, unlimited lookback
#
# CONSEQUENCE: The full 79-dim model can now be trained from 2014 onwards,
# enabling 5 non-overlapping full-model folds covering all major market
# regimes: COVID crash (2020), bear market (2022), recovery (2023),
# AI bull run (2024), and 2025 (out-of-sample).
#
# REGIME SIGNAL NOTE (Phase 1 retrain on 2014–2025):
#   Including COVID 2020 enables the HMM to learn all 4 states.  Fold 1
#   (test 2020) exercises the crash and high_vol regimes.
# ────────────────────────────────────────────────────────────────────────────
evaluation:
  folds:
    - fold_id: 1
      model_type: "full"
      obs_dim: 79
      description: "Full model (79-dim), test year 2020 (COVID crash)"
      train_start: "2014-01-03"
      train_end:   "2018-12-31"
      val_start:   "2019-01-01"
      val_end:     "2019-12-31"
      test_start:  "2020-01-01"
      test_end:    "2020-12-31"

    - fold_id: 2
      model_type: "full"
      obs_dim: 79
      description: "Full model (79-dim), test year 2022 (bear market, -33% NASDAQ)"
      train_start: "2014-01-03"
      train_end:   "2020-12-31"
      val_start:   "2021-01-01"
      val_end:     "2021-12-31"
      test_start:  "2022-01-01"
      test_end:    "2022-12-31"

    - fold_id: 3
      model_type: "full"
      obs_dim: 79
      description: "Full model (79-dim), test year 2023 (recovery)"
      train_start: "2014-01-03"
      train_end:   "2021-12-31"
      val_start:   "2022-01-01"
      val_end:     "2022-12-31"
      test_start:  "2023-01-01"
      test_end:    "2023-12-31"

    - fold_id: 4
      model_type: "full"
      obs_dim: 79
      description: "Full model (79-dim), test year 2024 (AI bull run)"
      train_start: "2014-01-03"
      train_end:   "2022-12-31"
      val_start:   "2023-01-01"
      val_end:     "2023-12-31"
      test_start:  "2024-01-01"
      test_end:    "2024-12-31"

    - fold_id: 5
      model_type: "full"
      obs_dim: 79
      description: "Full model (79-dim), test year 2025 [default split]"
      train_start: "2014-01-03"
      train_end:   "2023-12-31"
      val_start:   "2024-01-01"
      val_end:     "2024-12-31"
      test_start:  "2025-01-01"
      test_end:    "2025-12-31"

    - fold_id: "R"
      model_type: "regime_only"
      obs_dim: 34
      description: "Regime-only (34-dim, no sentiment), bear market test 2022-H2"
      # Per-ticker features: log_return_1d/5d/21d, realized_vol_21d,
      #                      days_since_filing, has_sentiment_data  (6 × 5 = 30)
      # Shared features    : prob_low, prob_med, prob_high, prob_crash           (4)
      n_per_ticker_features_override: 6
      train_start: "2019-04-03"
      train_end:   "2021-12-31"
      val_start:   "2022-01-01"
      val_end:     "2022-06-30"
      test_start:  "2022-07-01"
      test_end:    "2022-12-31"

env:
  n_tickers: 5
  n_per_ticker_features: 15
  n_shared_features: 4
  obs_dim: 79            # 5 * 15 + 4  (full model: 14 original + has_x_data)
  action_dim: 6          # 5 tickers + 1 cash
  transaction_cost: 0.001  # lambda_tc: 10 bps per unit weight turnover
  vol_eps:    1.0e-6
  vol_window: 21

  # ── Drawdown penalty ────────────────────────────────────────────────────────
  lambda_dd:    0.5      # penalty coefficient
  dd_threshold: 0.05     # only penalise drawdowns > 5%

  # ── Concentration constraint (Phase 4, Task 1) ─────────────────────────────
  # Iterative clip-and-redistribute projection onto constrained simplex.
  # Value of 1.0 disables the constraint (backward compatible).
  max_weight_per_ticker: 0.35   # 35% cap per asset (including cash position)

  # ── Diversification entropy bonus (Phase 4, Task 1) ───────────────────────
  # Additive reward shaping: reward += lambda_div * H(w) / ln(n_assets)
  # where H(w) = −Σ w_i ln(w_i) is the weight Shannon entropy.
  # Additive and potential-based → preserves optimal policy (Ng et al. 1999).
  lambda_div: 0.1        # normalised entropy bonus weight

  # ── CVaR Lagrangian (Phase 4, Task 3) ──────────────────────────────────────
  cvar_alpha:       0.05   # 5th-percentile tail (CVaR_5%)
  cvar_threshold:   0.015  # maximum tolerated daily CVaR loss rate (1.5%, tighter)
  cvar_lr:          0.005  # Lagrangian dual ascent step size (faster convergence)
  lambda_cvar_init: 0.0    # initial Lagrangian multiplier (starts unconstrained)
  var_alpha_init:  -100.0  # initial VaR estimate (−100 = never triggers)

ppo:
  policy: "MlpPolicy"
  learning_rate: 3.0e-4
  lr_schedule: "linear"    # "constant" or "linear"
  n_steps: 252
  batch_size: 126          # 252 × 4 envs = 1008 total; 1008 / 126 = 8 minibatches
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch: [256, 256]
    activation_fn: "Tanh"
  total_timesteps: 500000
  eval_freq: 10000
  checkpoint_freq: 50000

training:
  seed: 42
  norm_reward: true
  clip_reward: 10.0
  n_envs: 4

dapo:
  total_timesteps: 100000   # shorter budget for DAPO convergence tests
  K: 8                       # group size (samples per timestep)
  eps_low: 0.1               # asymmetric clip lower
  eps_high: 0.2              # asymmetric clip upper
  filter_min_std: 0.0001     # lowered: constrained softmax compresses action space

tuning:
  n_trials: 50
  tuning_timesteps: 100000

output:
  dir: "output"
  model_dir: "output/trained_model"
  metrics_file: "output/eval_metrics.json"
  weights_file: "output/portfolio_weights.csv"
  curves_file:  "output/training_curves.png"
  vecnormalize_stats: "output/trained_model/vecnormalize_stats.pkl"
  optuna_storage: "output/optuna_study.db"
